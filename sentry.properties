# Sentry Configuration
# Get your DSN from: https://sentry.io/settings/projects/YOUR_PROJECT/keys/
# 
# Quick Setup:
# 1. Go to https://sentry.io/signup/ (FREE account)
# 2. Create a new project (select "Android")
# 3. Copy your DSN from the setup page
# 4. Paste it below

# Your Sentry DSN - REQUIRED for crash reporting to work
# Format: https://PUBLIC_KEY@o{ORG_ID}.ingest.sentry.io/{PROJECT_ID}
dsn=https://examplePublicKey@o0000000.ingest.sentry.io/0000000

defaults.url=https://sentry.io/
defaults.org=expense-tracker
defaults.project=android-expense-tracker

# Auth token (optional, for uploading ProGuard/source maps)
# auth.token=YOUR_AUTH_TOKEN_HERE

# NOTE: The app will work even with placeholder DSN, but crashes won't be reported
# Update the DSN above with your real one from sentry.io
